# Included inside Swagger UI's server block by 45-railway.sh.

# Health check for Railway; answers without login and ignores BASE_URL.
location = /healthz {
  auth_basic off;
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# OpenAPI files on the Railway volume (/data/specs).
# GET/HEAD: public, so Swagger UI and other tools can read them.
# PUT/DELETE: HTTP basic auth (user SPECS_USER, password SPECS_PASSWORD).
location ^~ /specs/ {
  root /data;
  autoindex on;
  autoindex_format json;
  expires -1;
  # serve uploads only as data, never as pages
  types { application/json json; text/plain yaml yml; }
  default_type text/plain;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'none'; sandbox" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
  add_header Cache-Control "no-store" always;

  client_max_body_size 25m;
  client_body_temp_path /data/.upload-tmp;
  dav_methods PUT DELETE;
  dav_access user:rw group:r all:r;
  create_full_put_path off;

  limit_except GET HEAD {
    auth_basic "Swagger UI specs";
    auth_basic_user_file /etc/nginx/railway/htpasswd;
  }
}
